name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        backend: [base, jax, torch]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install .
          pip install pytest flake8 flake8-print
          if [ "${{ matrix.backend }}" = "jax" ]; then pip install 'jax[cpu]'; fi
          if [ "${{ matrix.backend }}" = "torch" ]; then pip install torch; fi
      - name: Run linting
        run: flake8 --select=T201 src/styne
      - name: Run supported tests
        run: python3 -m pytest tests -m 'not slow'
      - name: Run benchmark smoke test
        run: python3 benchmarks/backend_smoke.py
      - name: Run quickstart smoke test
        run: STYNE_SMOKE=1 python3 examples/01_quickstart.py
