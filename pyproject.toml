[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "styne"
version = "0.2.1"
description = "A Python library for high-dimensional Bayesian inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Robert Kutri", email = "r.kutri@gmail.com"},
]
dependencies = [
    "numpy>=1.24.4",
    "scipy>=1.10.1",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
plotting = [
    "matplotlib>=3.7.0",
]
reproducibility = [
    "joblib>=1.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "flake8>=6.0.0",
    "flake8-print>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/rkutri/styne"
Repository = "https://github.com/rkutri/styne"

[tool.hatch.build]
exclude = [
    "/reproducibility",
    "/benchmarks",
]

[tool.hatch.build.targets.wheel]
packages = ["src/styne"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
